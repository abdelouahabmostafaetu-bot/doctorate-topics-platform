name: meili-sync

# مزامنة MongoDB → Meilisearch
# Sync MongoDB -> Meilisearch. Runs daily and can be triggered manually,
# which also serves as the recovery path if the Meilisearch container is
# restarted on ephemeral storage.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-audit --no-fund

      - name: Wait for Meilisearch
        env:
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$MEILI_HOST/health" >/dev/null; then
              echo "Meilisearch is up"; exit 0
            fi
            echo "waiting ($i)..."; sleep 10
          done
          echo "Meilisearch did not become healthy"; exit 1

      - name: Sync index
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
        run: npm run meili:sync

      - name: Index stats
        env:
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
        run: |
          curl -fsS -H "Authorization: Bearer $MEILI_MASTER_KEY" \
            "$MEILI_HOST/indexes/theses/stats"
