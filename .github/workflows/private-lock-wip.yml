# One-shot lockfile regeneration on this non-production WIP branch only.
name: Generate private-access WIP lockfile
on:
  push:
    branches: ['wip/private-access-foundation']
    paths: ['.github/workflows/private-lock-wip.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: wip/private-access-foundation
      - name: Generate lockfile without executing install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm .github/workflows/private-lock-wip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/private-lock-wip.yml
          git commit -m 'WIP: synchronize lockfile and remove temporary workflow'
          git push origin HEAD:wip/private-access-foundation
