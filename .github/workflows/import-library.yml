name: Import math library

on:
  workflow_dispatch:
    inputs:
      source:
        description: "المصدر"
        type: choice
        default: gutenberg
        options:
          - gutenberg
          - archive
          - openalex
          - all
      limit:
        description: "الحد الأقصى للكتب في كل مصدر"
        type: string
        default: "100"
      dryRun:
        description: "وضع تجريبي — لا يكتب شيئًا"
        type: boolean
        default: true
      hostFiles:
        description: "نسخ الملفات والأغلفة إلى Azure"
        type: boolean
        default: false
      noLearn:
        description: "تعطيل مرحلة التعلّم الذاتي (للمقارنة فقط)"
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run importer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_LIBRARY_CONTAINER: ${{ vars.AZURE_LIBRARY_CONTAINER }}
          OPENALEX_MATH_CONCEPT: ${{ vars.OPENALEX_MATH_CONCEPT }}
        run: |
          npx tsx scripts/import-library.ts \
            --source=${{ inputs.source }} \
            --limit=${{ inputs.limit }} \
            ${{ inputs.dryRun && '--dry-run' || '' }} \
            ${{ inputs.hostFiles && '--host-files' || '' }} \
            ${{ inputs.noLearn && '--no-learn' || '' }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: library-import-report
          path: scripts/library/out/
          if-no-files-found: ignore
