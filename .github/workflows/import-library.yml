name: Import math library

# يعمل على خوادم GitHub — لا حاجة لتشغيل أي شيء على الحاسوب الشخصي.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "المصدر"
        type: choice
        default: gutenberg
        options:
          - gutenberg
          - openalex
          - all
      limit:
        description: "عدد الكتب لكل مصدر"
        default: "100"
      dryRun:
        description: "وضع تجريبي (تقرير فقط، بلا كتابة)"
        type: boolean
        default: true
      hostFiles:
        description: "نسخ الملفات إلى R2 (الرخص المسموحة فقط)"
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run importer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_PUBLIC_URL_BASE: ${{ secrets.STORAGE_PUBLIC_URL_BASE }}
        run: |
          npx tsx scripts/import-library.ts \
            --source=${{ inputs.source }} \
            --limit=${{ inputs.limit }} \
            ${{ inputs.dryRun && '--dry-run' || '' }} \
            ${{ inputs.hostFiles && '--host-files' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-import-report
          path: scripts/library/out/
          if-no-files-found: ignore
