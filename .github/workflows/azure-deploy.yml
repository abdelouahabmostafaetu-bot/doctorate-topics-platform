name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci يفشل إن لم يكن package-lock.json متزامناً مع package.json؛
      # نرجع عندها إلى npm install حتى لا يتوقّف النشر.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - run: npx prisma generate

      # قيم البيئة هذه مطلوبة فقط إذا كان البناء (build) يقرأ قاعدة البيانات
      # أو يولّد صفحات ساكنة تحتاج مفاتيح أخرى. أضف أي متغير إضافي بنفس الطريقة.
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_LIBRARY_CONTAINER: ${{ vars.AZURE_LIBRARY_CONTAINER }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}

      # نجمّع حزمة standalone: server.js + node_modules المُتتبَّعة فقط.
      # الملفات الساكنة وpublic لا تُنسخ تلقائيًا في وضع standalone فننسخها يدويًا،
      # ومحرك Prisma ومتصفح chromium ننسخهما صراحةً لأن التتبع الآلي قد يفوتهما.
      # startup.sh يثبّت مكتبات النظام التي يحتاجها chromium ثم يشغل الخادم.
      - name: Assemble the standalone bundle
        run: |
          mkdir site
          cp -r .next/standalone/. site/
          cp -r .next/static site/.next/static
          cp -r public site/public
          mkdir -p site/node_modules/.prisma
          cp -r node_modules/.prisma/. site/node_modules/.prisma/
          mkdir -p site/node_modules/@sparticuz
          rm -rf site/node_modules/@sparticuz/chromium site/node_modules/puppeteer-core
          cp -r node_modules/@sparticuz/chromium site/node_modules/@sparticuz/chromium
          cp -r node_modules/puppeteer-core site/node_modules/puppeteer-core
          cp startup.sh site/startup.sh
          chmod +x site/startup.sh
          cat > site/package.json <<'EOF'
          {
            "name": "doctorate-topics-platform",
            "private": true,
            "scripts": { "start": "node server.js" }
          }
          EOF

      - name: Zip the standalone bundle
        working-directory: site
        run: zip -r ../release.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: none
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      # Deploy directly to Kudu using the existing publish profile. This avoids
      # downloading azure/webapps-deploy from codeload.github.com, which can
      # transiently return 429/503 before the deploy job starts.
      - name: Deploy ZIP to Azure App Service via Kudu
        env:
          PUBLISH_PROFILE_XML: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.fromstring(os.environ["PUBLISH_PROFILE_XML"])
          profiles = list(root)
          profile = next(
              (item for item in profiles if item.attrib.get("publishMethod") == "ZipDeploy"),
              None,
          )
          if profile is None:
              profile = next(
                  (item for item in profiles if item.attrib.get("publishUrl") and item.attrib.get("userName")),
                  None,
              )
          if profile is None:
              raise SystemExit("No usable ZipDeploy publish profile was found")

          publish_url = profile.attrib["publishUrl"]
          if "://" in publish_url:
              publish_url = publish_url.split("://", 1)[1]
          kudu_host = publish_url.split(":", 1)[0]

          import shlex

          with open(".kudu.env", "w", encoding="utf-8") as env_file:
              env_file.write(f"export KUDU_HOST={shlex.quote(kudu_host)}\n")
              env_file.write(f"export KUDU_USER={shlex.quote(profile.attrib['userName'])}\n")
              env_file.write(f"export KUDU_PASSWORD={shlex.quote(profile.attrib['userPWD'])}\n")
          PY
          chmod 600 .kudu.env
          trap 'rm -f .kudu.env' EXIT
          . ./.kudu.env

          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 15 --retry-max-time 240 \
            --user "$KUDU_USER:$KUDU_PASSWORD" \
            --header "Content-Type: application/zip" \
            --data-binary @release.zip \
            "https://${KUDU_HOST}/api/zipdeploy?isAsync=false"
