name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx prisma generate

      # قيم البيئة هذه مطلوبة فقط إذا كان البناء (build) يقرأ قاعدة البيانات
      # أو يولّد صفحات ساكنة تحتاج مفاتيح أخرى. أضف أي متغير إضافي بنفس الطريقة.
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_LIBRARY_CONTAINER: ${{ vars.AZURE_LIBRARY_CONTAINER }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}

      # نجمّع حزمة standalone: server.js + node_modules المُتتبَعة فقط.
      # الملفات الساكنة وpublic لا تُنسخ تلقائيًا في وضع standalone فننسخها يدويًا،
      # ومحرك Prisma ومتصفح chromium ننسخهما صراحةً لأن التتبع الآلي قد يفوتهما.
      # startup.sh يثبّت مكتبات النظام التي يحتاجها chromium ثم يشغّل الخادم.
      - name: Assemble the standalone bundle
        run: |
          mkdir site
          cp -r .next/standalone/. site/
          cp -r .next/static site/.next/static
          cp -r public site/public
          mkdir -p site/node_modules/.prisma
          cp -r node_modules/.prisma/. site/node_modules/.prisma/
          mkdir -p site/node_modules/@sparticuz
          rm -rf site/node_modules/@sparticuz/chromium site/node_modules/puppeteer-core
          cp -r node_modules/@sparticuz/chromium site/node_modules/@sparticuz/chromium
          cp -r node_modules/puppeteer-core site/node_modules/puppeteer-core
          cp startup.sh site/startup.sh
          chmod +x site/startup.sh
          cat > site/package.json <<'EOF'
          {
            "name": "doctorate-topics-platform",
            "private": true,
            "scripts": { "start": "node server.js" }
          }
          EOF

      - name: Zip the standalone bundle
        working-directory: site
        run: zip -r ../release.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: none
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - run: unzip -q release.zip -d site

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site
