name: Harvest Algerian mathematics theses

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Number of universities harvested at the same time (1-8)"
        required: false
        default: "4"
  schedule:
    - cron: "17 2 * * 0"

concurrency:
  group: thesis-harvest-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TA_SEARCH_KEY: ${{ secrets.TA_SEARCH_KEY }}
      MEILI_HOST: ${{ secrets.MEILI_HOST }}
      MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
      DNS_SERVERS: "1.1.1.1,8.8.8.8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Harvest all configured universities
        run: npm run harvest-national -- --concurrency=${{ inputs.concurrency || '4' }}
