name: Bulk import exams from import/batch.json

on:
  push:
    branches: [main]
    paths:
      - "import/batch.json"
      - ".github/workflows/import-bulk.yml"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Bulk import with retry until done
        env:
          MCP_SECRET: ${{ secrets.MCP_SECRET }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "${MCP_SECRET:-}" ]; then echo "ERROR: MCP_SECRET is not configured in repo secrets"; exit 1; fi
          echo "Fetching batch.json from $REPO @ $GITHUB_SHA"
          curl -fsSL --max-time 60 "https://raw.githubusercontent.com/$REPO/$GITHUB_SHA/import/batch.json" -o batch.json
          total=$(jq '.exams | length' batch.json)
          echo "Exams in batch: $total"
          # /api/mcp is exempt from the signin redirect and exposes add_exams_bulk,
          # which reads the PDF link from sourceNote — map pdfUrl to it here.
          jq '{defaults: .defaults, exams: [.exams[] | . + {sourceNote: .pdfUrl}]}' batch.json > args.json
          jq -n --slurpfile args args.json '{jsonrpc:"2.0", id:"bulk-import", method:"tools/call", params:{name:"add_exams_bulk", arguments:$args[0]}}' > payload.json
          SITE_ORIGIN="https://www.docmathdz.dev"
          for attempt in $(seq 1 15); do
            echo "=== Attempt $attempt/15 ==="
            code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
              --max-time 300 \
              --header "Authorization: Bearer $MCP_SECRET" \
              --header "Content-Type: application/json" \
              --data-binary @payload.json \
              "$SITE_ORIGIN/api/mcp" || echo "000")
            echo "HTTP $code"
            if [ "$code" = "200" ] && jq -e '.result.content[0].text' response.json >/dev/null 2>&1; then
              jq -r '.result.content[0].text' response.json | tee import-result.json
              if jq -e '.importedCount' import-result.json >/dev/null 2>&1; then
                imported=$(jq '.importedCount' import-result.json)
                failed=$(jq '.failedCount' import-result.json)
                echo "imported=$imported failed=$failed total=$total"
                if [ "$failed" = "0" ] && [ "$imported" = "$total" ]; then
                  echo "Bulk import completed successfully."
                  exit 0
                fi
              fi
            else
              echo "Response head:"; head -c 500 response.json || true; echo
            fi
            echo "Retrying in 15s (finished exams are skipped instantly)..."
            sleep 15
          done
          echo "Import did not complete after all attempts."
          exit 1
